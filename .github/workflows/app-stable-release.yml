name: 天将漫创三平台 Stable Release

on:
  push:
    tags:
      - "v*.*.*"
      - "!v*-*"
  workflow_dispatch:

jobs:
  create-tag:
    if: ${{ github.repository == 'hyc0122/tj_app' && github.event_name == 'workflow_dispatch' }}
    name: 从根 package.json 自动创建 Stable Tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: 检出公开 main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - name: 从唯一版本源创建不可移动 Tag
        id: release
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$(node -p "require('./app/package.json').version")" = "$version"
          tag="v${version}"
          git fetch origin main --tags
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          test -z "$(git tag --list "$tag")"
          test -z "$(git ls-remote --tags origin "refs/tags/$tag" "refs/tags/$tag^{}")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" HEAD -m "Stable release $tag: Tianjiang desktop client"
          git push origin "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  release-pipeline:
    needs: [create-tag]
    # Tag 由 GITHUB_TOKEN 创建时不会递归触发 push Run，因此手动发布必须在同一 Run 内继续构建。
    if: >-
      ${{
        always() &&
        github.repository == 'hyc0122/tj_app' &&
        (
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && needs.create-tag.result == 'success')
        )
      }}
    uses: ./.github/workflows/app-cloud-release.yml
    with:
      tag: ${{ github.event_name == 'push' && github.ref_name || needs.create-tag.outputs.tag }}
      channel: stable
      prerelease: false
    secrets: inherit
